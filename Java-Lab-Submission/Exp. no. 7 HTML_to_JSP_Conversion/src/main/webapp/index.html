<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML to JSP Experiment</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f6fb; margin: 0; padding: 40px; }
    main { max-width: 650px; margin: auto; background: white; padding: 28px; border-radius: 12px; }
    h1 { color: #244a86; }
    a { color: #1458a6; }
  </style>
</head>
<body>
  <main>
    <h1>HTML Page</h1>
    <p>This is a static HTML page.</p>

  </main>
</body>
</html>
